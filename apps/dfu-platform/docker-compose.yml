services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfu}
      POSTGRES_USER: ${POSTGRES_USER:-dfu_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dfu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfu_app} -d ${POSTGRES_DB:-dfu}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dfu_postgres_data:
